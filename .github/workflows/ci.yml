name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Full browser matrix (adds WebKit, whose system libraries are slow to install):
  # weekly, and on demand from the Actions tab ("Run workflow").
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scans the full git history for committed secrets (keys, tokens, passwords).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --redact --no-banner --exit-code 1

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails on high/critical vulnerabilities in code that ships to players.
      # Dev-only advisories are triaged through Dependabot instead.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, type-check, format, unused code, unit tests, build + bundle budget
        run: npm run check

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # WebKit (iPhone) needs ~120 MB of system packages whose install can stall for many
      # minutes, so it runs in the scheduled/manual full matrix only.
      - name: Choose browsers
        id: browsers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "browsers=chromium firefox webkit" >> "$GITHUB_OUTPUT"
            echo "projects=" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "browsers=chromium firefox" >> "$GITHUB_OUTPUT"
            echo "projects=--project=android-chrome --project=desktop-chrome --project=desktop-firefox --project=dev-strictmode" >> "$GITHUB_OUTPUT"
          fi

      - name: Install WebKit system packages (full matrix only)
        if: steps.browsers.outputs.full == 'true'
        timeout-minutes: 40
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          npx playwright install-deps webkit

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ steps.browsers.outputs.browsers }}

      - name: End-to-end tests
        run: npm run e2e -- ${{ steps.browsers.outputs.projects }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
